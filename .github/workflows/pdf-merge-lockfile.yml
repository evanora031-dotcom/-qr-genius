name: Refresh PDF merge lockfile (temporary)
on:
  push:
    branches:
      - feat/pdf-merge-engine-20261110
    paths:
      - package.json
      - .github/workflows/pdf-merge-lockfile.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve and lock dependencies
        run: bun install
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock pdf-lib dependency"
            git pull --rebase origin feat/pdf-merge-engine-20261110
            git push origin HEAD:feat/pdf-merge-engine-20261110
          fi
