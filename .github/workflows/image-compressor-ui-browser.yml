name: Image compressor UI browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/ImageCompressor.tsx'
      - 'scripts/image-compressor-ui-browser.mjs'
      - '.github/workflows/image-compressor-ui-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-compressor-ui-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build preview
        run: npm run build
      - name: Start local preview and run real download smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/tools/image-compressor > /dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/preview.log; exit 1; fi
          PREVIEW_URL=http://127.0.0.1:4173 node scripts/image-compressor-ui-browser.mjs
