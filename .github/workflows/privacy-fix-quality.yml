name: Quality and contact security checks

on:
  push:
    branches:
      - main
      - fix/contact-input-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Contact endpoint tests
        run: bunx tsx --test tests/contact-api.test.ts
      - name: Production build
        run: bun run build
