name: Production footer contrast

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/footer-production-contrast.mjs'
      - '.github/workflows/footer-production-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footer-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live footer contrast in four locales
        env:
          BASE_URL: https://getqrgenius.com
        run: node scripts/footer-production-contrast.mjs
