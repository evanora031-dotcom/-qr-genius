name: Image compressor mobile Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/ImageCompressor.tsx'
      - 'scripts/prerender-seo.ts'
      - '.github/workflows/image-compressor-lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock --legacy-peer-deps lighthouse@12.8.2
      - name: Build production preview
        run: npm run build
      - name: Measure mobile Lighthouse
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/tools/image-compressor > /dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/preview.log; exit 1; fi
          npx lighthouse http://127.0.0.1:4173/tools/image-compressor --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/lighthouse-mobile.json --quiet
          npx lighthouse http://127.0.0.1:4173/tools/image-compressor --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --blocked-url-patterns="*fonts.googleapis.com*,*fonts.gstatic.com*" --output=json --output-path=/tmp/lighthouse-no-webfonts.json --quiet
          node --input-type=module -e '
            import fs from "node:fs";
            const report=JSON.parse(fs.readFileSync("/tmp/lighthouse-mobile.json","utf8"));
            const score=Math.round(report.categories.performance.score*100);
            const cls=report.audits["cumulative-layout-shift"].numericValue;
            const lcp=report.audits["largest-contentful-paint"].numericValue;
            const tbt=report.audits["total-blocking-time"].numericValue;
            const noFonts=JSON.parse(fs.readFileSync("/tmp/lighthouse-no-webfonts.json","utf8"));
            console.log(JSON.stringify({score,cls,lcp_ms:lcp,tbt_ms:tbt,without_webfonts:{score:Math.round(noFonts.categories.performance.score*100),cls:noFonts.audits["cumulative-layout-shift"].numericValue}},null,2));
            if(score<90 || cls>=0.1) process.exitCode=1;
          '
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-compressor-mobile-lighthouse
          path: |
            /tmp/lighthouse-mobile.json
            /tmp/lighthouse-no-webfonts.json
          if-no-files-found: warn
