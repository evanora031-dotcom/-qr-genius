name: HTTP routing smoke test (preview and production)
on:
  pull_request:
    paths:
      - 'public/404.html'
      - '.github/workflows/preview-http-routing.yml'
  push:
    branches: [main]
    paths:
      - 'public/404.html'
      - '.github/workflows/preview-http-routing.yml'
  workflow_dispatch:

jobs:
  http-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Check real 404 and existing routes on Cloudflare Pages
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'https://d800896f.qr-genius-1on.pages.dev' || 'https://getqrgenius.com' }}
        run: |
          set -euo pipefail
          echo "Testing $BASE_URL"
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 -o /dev/null "$BASE_URL/"; then break; fi
            sleep 10
          done
          for path in / /generator /tools/url /tools/wifi /tools/whatsapp /tools/business-vcard /tools/image-compressor /tools/images-to-pdf /tools/merge-pdf /ar/ /fr/ /es/ /en/blog/ /en/blog/how-to-make-business-card-qr-code /robots.txt /sitemap.xml; do
            code=$(curl -LsS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path => $code (expected 200)"
            test "$code" = 200
          done
          for path in /this-page-does-not-exist-xyz /tools/zzz-not-real; do
            code=$(curl -LsS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path => $code (expected 404)"
            test "$code" = 404
          done
